[package]
name = "vekrel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
# Exposes `vekrel::replay` (test support) to integration tests and tools.
replay = []

[dev-dependencies]
# Self dev-dependency so `cargo test` builds the lib with `replay` for tests/replay.rs.
vekrel = { path = ".", features = ["replay"] }
reqwest = { version = "0.13.5", features = ["json"] }
